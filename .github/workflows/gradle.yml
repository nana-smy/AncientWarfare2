name: Mod Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 8
    - name: Make gradlew executable
      run: chmod +x gradlew
    - name: Build with Gradle
      run: |
        ./gradlew clean
        ./gradlew setupCIWorkspace
        ./gradlew build --stacktrace
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ancient-warfare2-build
        path: build/libs/*.jar
        if-no-files-found: error
    - name: Publish GitHub Release (readable version)
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -e
        # pick the main jar (exclude -sources)
        main_jar=$(ls build/libs/*.jar | grep -v '\-sources\.jar' | head -n1)
        echo "main jar: $main_jar"
        base=$(basename "$main_jar")
        # extract mod version from e.g. ancientwarfare-1.12.2-2.10.2.jar -> 2.10.2
        ver=$(echo "$base" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | tail -n1)
        build_num="${{ github.run_number }}"
        tag="v${ver}-build.${build_num}"
        echo "release tag: $tag"
        gh release create "$tag" "$main_jar" build/libs/*-sources.jar \
          --repo "${{ github.repository }}" \
          --title "Ancient Warfare 2 v${ver} (build #${build_num})" \
          --notes "Automated build from branch ${{ github.ref_name }} (MC 1.12.2, Forge 14.23.5.2816). Built with GitHub Actions."
