name: Mod Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 8
    - name: Make gradlew executable
      run: chmod +x gradlew
    - name: Build with Gradle
      run: |
        ./gradlew clean
        ./gradlew setupCIWorkspace
        ./gradlew build --stacktrace
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ancient-warfare2-build
        path: build/libs/*.jar
        if-no-files-found: error
    - name: Publish GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        tag="aw2-build-$(date +%Y%m%d-%H%M%S)"
        gh release create "$tag" build/libs/*.jar \
          --repo "${{ github.repository }}" \
          --title "Ancient Warfare 2 build $tag" \
          --notes "Automated build from branch ${{ github.ref_name }} (MC 1.12.2, Forge 14.23.5.2816). Built with GitHub Actions."
